name: Build e2fsck 1.47.4 (Windows x64, static MinGW)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MinGW-w64 x64 static build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep the workflow and its patcher separate from the upstream source
      # checkout. Checking upstream out at the workspace root would replace
      # the repository containing this workflow/patch script.
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          path: build-kit

      - name: Checkout upstream e2fsprogs 1.47.4
        uses: actions/checkout@v4
        with:
          repository: tytso/e2fsprogs
          ref: v1.47.4
          path: e2fsprogs
          fetch-depth: 1

      - name: Set up Python for the source compatibility patch
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-cc

      - name: Apply MinGW compatibility patch to e2fsck
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/build-kit/scripts/patch-e2fsck-windows.py" "$env:GITHUB_WORKSPACE/e2fsprogs/e2fsck"

      - name: Configure and build e2fsck
        working-directory: e2fsprogs
        run: |
          set -euo pipefail
          export CFLAGS="-O2 -pipe"
          export LDFLAGS="-static -static-libgcc"
          ./configure --disable-nls

          # Build the generated headers and static libraries required by e2fsck.
          make -j2 top-deps V=1 2>&1 | tee build.log
          make -j2 -C lib/et all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/uuid all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/blkid all V=1 2>&1 | tee -a build.log

          # These headers are generated by compile_et. A direct per-directory
          # build can start compiling objects before Make has pulled in the
          # generated-header prerequisites, so request them explicitly.
          make -j2 -C lib/ext2fs ext2_err.h V=1 2>&1 | tee -a build.log
          test -s lib/ext2fs/ext2_err.h
          test -s lib/ext2fs/ext2_err.c

          make -j2 -C lib/support prof_err.h V=1 2>&1 | tee -a build.log
          test -s lib/support/prof_err.h
          test -s lib/support/prof_err.c

          make -j2 -C lib/ext2fs all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/support all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/e2p all V=1 2>&1 | tee -a build.log

          # Build the executable explicitly rather than unsupported tools.
          make -j2 -C e2fsck e2fsck V=1 2>&1 | tee -a build.log
          test -f e2fsck/e2fsck.exe
          ./e2fsck/e2fsck.exe -V 2>&1 | tee -a build.log

          # Build mke2fs only as a test-image generator; do not package it.
          make -j2 -C misc mke2fs V=1 2>&1 | tee -a build.log
          test -f misc/mke2fs.exe
          ./misc/mke2fs.exe -F -q -t ext4 test-e2fsck.ext4 64M 2>&1 | tee -a build.log
          ./e2fsck/e2fsck.exe -fn test-e2fsck.ext4 2>&1 | tee -a build.log
        env:
          MSYSTEM: MINGW64

      - name: Verify standalone dependencies and package
        working-directory: e2fsprogs
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp e2fsck/e2fsck.exe ../dist/e2fsck.exe
          strip ../dist/e2fsck.exe

          objdump -p ../dist/e2fsck.exe | sed -n 's/^[[:space:]]*DLL Name: //p' \
            | sort -fu > ../dist/DEPENDENCIES.txt

          # Reject MinGW runtime DLL imports. Normal Windows system DLLs are OK.
          if grep -Eiq '^(libgcc_s|libstdc\+\+|libwinpthread|libintl|libiconv).*\.dll$' ../dist/DEPENDENCIES.txt; then
            echo "ERROR: executable still depends on a non-Windows runtime DLL:" >&2
            cat ../dist/DEPENDENCIES.txt >&2
            exit 1
          fi

          cat > ../dist/README.txt <<'EOF'
          e2fsck 1.47.4 - Windows x64 (MinGW-w64 static build)

          Source: tytso/e2fsprogs tag v1.47.4.
          This is an experimental native Windows port build, not an official
          upstream Windows release. MinGW runtime DLLs are checked at build time;
          Windows system DLLs remain normal operating-system dependencies.

          Windows compatibility changes in e2fsck/unix.c:
          - use the upstream default_io_manager abstraction, which selects
            windows_io_manager on Windows;
          - use the Windows CRT signal() API for Ctrl+C / termination;
          - skip Linux-only battery status probing.

          The CI run validates e2fsck -V and runs e2fsck -fn against a fresh
          ext4 image. This does not validate every repair path or raw-drive
          access. Windows mounted-volume detection is not equivalent to Linux
          mount detection. Never run a repair on a mounted/in-use volume.
          Test on a backup image before using it with a physical phone partition.
          EOF

          sha256sum ../dist/e2fsck.exe > ../dist/SHA256SUMS.txt
          cat ../dist/DEPENDENCIES.txt
          cat ../dist/SHA256SUMS.txt
        env:
          MSYSTEM: MINGW64

      - name: Upload e2fsck.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2fsck-1.47.4-windows-x64-static
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2fsck-1.47.4-build-log
          path: e2fsprogs/build.log
          if-no-files-found: ignore
          retention-days: 7
