name: Build e2fsck 1.47.4 (Windows x64, static)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MinGW-w64 x64 static build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout upstream e2fsprogs 1.47.4
        uses: actions/checkout@v4
        with:
          repository: tytso/e2fsprogs
          ref: v1.47.4
          fetch-depth: 1

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-cc
            mingw-w64-x86_64-python

      # ------------------------------------------------------------------
      # Vá source để build được trên MinGW-w64 (Windows).
      #  - ext2_io.h: thêm macro default_io_manager trỏ tới
      #    windows_io_manager trên _WIN32, unix_io_manager ở nơi khác.
      #  - Thay unix_io_manager -> default_io_manager trong các file sẽ
      #    được biên dịch (unix.c, mke2fs.c, plausible.c).
      #  - e2fsck/unix.c: thêm NAME_MAX dự phòng và shim struct sigaction
      #    / sigaction / SIGUSR1 / SIGUSR2 cho Windows.
      # ------------------------------------------------------------------
      - name: Apply Windows/MinGW compatibility patches
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib

          # ---- 1. lib/ext2fs/ext2_io.h: thêm default_io_manager ----
          p = pathlib.Path("lib/ext2fs/ext2_io.h")
          s = p.read_text()
          if "default_io_manager" not in s:
              s += (
                  "\n#ifndef default_io_manager\n"
                  "#ifdef _WIN32\n"
                  "extern io_manager windows_io_manager;\n"
                  "#define default_io_manager windows_io_manager\n"
                  "#else\n"
                  "#define default_io_manager unix_io_manager\n"
                  "#endif\n"
                  "#endif\n"
              )
              p.write_text(s)
              print("[patch] lib/ext2fs/ext2_io.h: added default_io_manager")
          else:
              print("[patch] lib/ext2fs/ext2_io.h: already has default_io_manager")

          # ---- 2. Thay unix_io_manager trong các file sẽ build ----
          for f in ["e2fsck/unix.c", "misc/mke2fs.c", "lib/support/plausible.c"]:
              p = pathlib.Path(f)
              if not p.exists():
                  print(f"[patch] {f}: skipped (not present)")
                  continue
              s = p.read_text()
              if "unix_io_manager" in s:
                  s = s.replace("unix_io_manager", "default_io_manager")
                  p.write_text(s)
                  print(f"[patch] {f}: unix_io_manager -> default_io_manager")

          # ---- 3. e2fsck/unix.c: NAME_MAX + sigaction shim ----
          p = pathlib.Path("e2fsck/unix.c")
          s = p.read_text()
          if "e2fsck_mingw_patched" not in s:
              anchor = '#include "e2fsck.h"'
              if anchor not in s:
                  raise SystemExit(
                      "ERROR: anchor not found in e2fsck/unix.c; "
                      "file may not be at expected version."
                  )
              block = """
          /* e2fsck_mingw_patched: Windows/MinGW compatibility shims */
          #ifndef NAME_MAX
          #define NAME_MAX 255
          #endif

          #ifdef _WIN32
          #include <signal.h>
          /* Minimal struct sigaction: e2fsck only uses signal handling on
             Unix for Ctrl-C / SIGUSR1/2; on Windows the calls become no-ops. */
          struct sigaction { void (*sa_handler)(int); int sa_flags; unsigned long sa_mask; };
          #define sigaction(sig, act, old) (0)
          #ifndef SIGUSR1
          #define SIGUSR1 0
          #endif
          #ifndef SIGUSR2
          #define SIGUSR2 0
          #endif
          #endif
          """
              s = s.replace(anchor, anchor + "\n" + block, 1)
              p.write_text(s)
              print("[patch] e2fsck/unix.c: added NAME_MAX + sigaction shims")
          else:
              print("[patch] e2fsck/unix.c: already patched")
          PY

      - name: Configure and build e2fsck
        run: |
          set -euo pipefail
          export CFLAGS="-O2 -pipe"
          export LDFLAGS="-static -static-libgcc"
          ./configure --disable-nls

          # Thư viện phụ thuộc (giữ đúng thứ tự upstream)
          make -j2 -C lib/et all V=1 2>&1 | tee build.log
          make -j2 -C lib/uuid all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/blkid all V=1 2>&1 | tee -a build.log

          # Sinh ext2_err.h tường minh để tránh race với -j2
          make -C lib/ext2fs ext2_err.h V=1 2>&1 | tee -a build.log

          # Build toàn bộ thư viện ext2fs + các lib phụ thuộc khác
          make -j2 -C lib/ext2fs all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/support all V=1 2>&1 | tee -a build.log
          make -j2 -C lib/e2p all V=1 2>&1 | tee -a build.log

          # Build e2fsck (target tường minh)
          make -j2 -C e2fsck e2fsck V=1 2>&1 | tee -a build.log

          test -f e2fsck/e2fsck.exe
          ./e2fsck/e2fsck.exe -V 2>&1 | tee -a build.log

          # Build mke2fs chỉ để tạo ảnh test (không đóng gói)
          make -j2 -C misc mke2fs V=1 2>&1 | tee -a build.log
          ./misc/mke2fs.exe -F -q -t ext4 test-e2fsck.ext4 64M 2>&1 | tee -a build.log
          ./e2fsck/e2fsck.exe -fn test-e2fsck.ext4 2>&1 | tee -a build.log
        env:
          MSYSTEM: MINGW64

      - name: Verify standalone dependencies and package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp e2fsck/e2fsck.exe dist/e2fsck.exe
          strip dist/e2fsck.exe

          objdump -p dist/e2fsck.exe | sed -n 's/^[[:space:]]*DLL Name: //p' \
            | sort -fu > dist/DEPENDENCIES.txt

          if grep -Eiq '^(libgcc_s|libstdc\+\+|libwinpthread|libintl|libiconv).*\.dll$' dist/DEPENDENCIES.txt; then
            echo "ERROR: executable still depends on a non-Windows runtime DLL:" >&2
            cat dist/DEPENDENCIES.txt >&2
            exit 1
          fi

          cat > dist/README.txt <<'EOF'
          e2fsck 1.47.4 - Windows x64 (MinGW-w64)

          Built from the upstream tytso/e2fsprogs repository, tag v1.47.4,
          with local Windows/MinGW compatibility patches applied.

          This package contains e2fsck.exe only. No Cygwin or MinGW runtime DLL
          should be required; standard Windows system DLLs remain dependencies.

          The CI build validates the version output and checks a freshly-created
          ext4 image in read-only mode (-f -n).

          IMPORTANT: This is a Windows port build, not an official upstream
          Windows release. Use it on a backup/copy of an ext4 image first.
          Raw Windows physical-partition access and mounted-volume detection
          are not equivalent to Linux /dev and mount handling.
          EOF

          sha256sum dist/e2fsck.exe > dist/SHA256SUMS.txt
          cat dist/DEPENDENCIES.txt
          cat dist/SHA256SUMS.txt
        env:
          MSYSTEM: MINGW64

      - name: Upload e2fsck.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2fsck-1.47.4-windows-x64-static
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2fsck-1.47.4-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
